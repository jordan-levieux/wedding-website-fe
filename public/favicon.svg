<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- two linked rings and two hearts, in the theme's primary and tertiary for light or dark tab bars -->
  <style>
    .ring { fill: none; stroke: #516445; stroke-width: 2.6; }
    .heart { fill: #af7a3d; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #b7cda7; }
      .heart { fill: #f1bb91; }
    }
  </style>
  <defs>
    <path id="heart" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    <!-- each ring has a gap where the other passes over it, so they read as linked -->
    <clipPath id="top-crossing"><circle cx="14.33" cy="13.9" r="3.6"/></clipPath>
    <clipPath id="bottom-crossing"><circle cx="17.67" cy="24.6" r="3.6"/></clipPath>
    <mask id="under-at-top" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="12" cy="20.5" r="7" fill="none" stroke="#000" stroke-width="5" clip-path="url(#top-crossing)"/>
    </mask>
    <mask id="under-at-bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="20" cy="18" r="7" fill="none" stroke="#000" stroke-width="5" clip-path="url(#bottom-crossing)"/>
    </mask>
  </defs>
  <circle class="ring" cx="12" cy="20.5" r="7" mask="url(#under-at-bottom)"/>
  <circle class="ring" cx="20" cy="18" r="7" mask="url(#under-at-top)"/>
  <use class="heart" href="#heart" transform="translate(6.5 7) rotate(-14) scale(0.34) translate(-12 -12.2)"/>
  <use class="heart" href="#heart" transform="translate(13.2 4) rotate(12) scale(0.23) translate(-12 -12.2)"/>
</svg>
